<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Il Poggiarello – Realtà Aumentata</title>

  <!-- Supporto import map per iOS < 16.4 e browser più vecchi -->
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; overscroll-behavior: none;
    }
    #ar-container { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }
    /* il video e il canvas creati da MindAR */
    #ar-container video, #ar-container canvas { position: absolute; }

    /* ---------- MIRINO DI SCANSIONE (angoli bianchi) ---------- */
    #scanner {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity .35s ease;
    }
    #scanner.hidden { opacity: 0; }
    .frame {
      position: relative;
      width: min(78vw, 62vh); aspect-ratio: 3 / 2;
    }
    .corner { position: absolute; width: 44px; height: 44px; border: 0 solid #fff; filter: drop-shadow(0 0 4px rgba(0,0,0,.6)); }
    .tl { top: 0; left: 0;  border-top-width: 5px; border-left-width: 5px;  border-top-left-radius: 14px; }
    .tr { top: 0; right: 0; border-top-width: 5px; border-right-width: 5px; border-top-right-radius: 14px; }
    .bl { bottom: 0; left: 0;  border-bottom-width: 5px; border-left-width: 5px;  border-bottom-left-radius: 14px; }
    .br { bottom: 0; right: 0; border-bottom-width: 5px; border-right-width: 5px; border-bottom-right-radius: 14px; }
    .frame { animation: breathe 2.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    .scanline {
      position: absolute; left: 6%; right: 6%; height: 2px; top: 10%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
      animation: scan 2.4s ease-in-out infinite;
    }
    @keyframes scan { 0% { top: 8%; opacity: .2; } 50% { opacity: 1; } 100% { top: 92%; opacity: .2; } }
    .hint {
      margin-top: 22px; padding: 10px 18px; border-radius: 22px;
      background: rgba(0,0,0,.55); font-size: 15px; letter-spacing: .3px; text-align: center;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }

    /* ---------- CARICAMENTO ---------- */
    #loading {
      position: fixed; inset: 0; z-index: 20; background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      transition: opacity .4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading img { width: min(60vw, 280px); }
    .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { margin: 0; font-size: 14px; opacity: .8; }

    /* ---------- MESSAGGI / ERRORI ---------- */
    #message {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      z-index: 30; max-width: 86vw; padding: 12px 18px; border-radius: 14px;
      background: rgba(0,0,0,.8); font-size: 14px; line-height: 1.4; text-align: center; display: none;
    }
    #error {
      position: fixed; inset: 0; z-index: 40; background: #000; display: none;
      flex-direction: column; align-items: center; justify-content: center; padding: 28px; text-align: center; gap: 14px;
    }
    #error h2 { margin: 0; font-weight: 600; font-size: 20px; }
    #error p { margin: 0; opacity: .85; line-height: 1.5; font-size: 15px; }

    /* ---------- VISUALIZZATORE SITO + BOTTONE ROSSO ---------- */
    #viewer {
      position: fixed; inset: 0; z-index: 50; background: #fff; display: none;
      flex-direction: column;
    }
    #viewer.open { display: flex; }
    #viewer-frame { flex: 1; width: 100%; border: 0; background: #fff; }
    #viewer-spinner {
      position: absolute; top: 40%; left: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px;
      border-radius: 50%; border: 3px solid rgba(0,0,0,.15); border-top-color: #b3001b; animation: spin 1s linear infinite;
    }
    #viewer-bar {
      flex: none; background: #fff; border-top: 1px solid #e3e3e3;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    }
    #back-ar {
      display: block; width: 100%; padding: 16px 12px; border: 0; border-radius: 6px;
      background: #c8102e; color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .3px;
      text-align: center; cursor: pointer; box-shadow: 0 4px 14px rgba(200,16,46,.35);
      -webkit-appearance: none; appearance: none;
    }
    #back-ar:active { background: #9e0c24; }
    #viewer-ext { text-align: center; font-size: 13px; color: #555; text-decoration: underline; }
    #error button, #error a {
      margin-top: 8px; padding: 12px 22px; border-radius: 24px; border: 0;
      background: #fff; color: #000; font-size: 15px; font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="ar-container"></div>

  <div id="scanner">
    <div class="frame">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="scanline"></div>
    </div>
    <div class="hint">Inquadra una pagina del libro</div>
  </div>

  <div id="loading">
    <img src="logopoggiarello.png" alt="Il Poggiarello" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='logopozzarello.png'}else{this.style.display='none'}">
    <div class="spinner"></div>
    <p id="loading-text">Caricamento…</p>
  </div>

  <div id="viewer" aria-hidden="true">
    <div id="viewer-spinner"></div>
    <iframe id="viewer-frame" title="Il Poggiarello" referrerpolicy="no-referrer-when-downgrade" allow="fullscreen; autoplay"></iframe>
    <div id="viewer-bar">
      <button id="back-ar" type="button">Torna alla realtà aumentata</button>
      <a id="viewer-ext" href="#" target="_blank" rel="noopener">La pagina non si vede? Aprila nel browser</a>
    </div>
  </div>

  <div id="message"></div>

  <div id="error">
    <h2 id="error-title">Fotocamera non disponibile</h2>
    <p id="error-text"></p>
    <button id="retry" type="button">Riprova</button>
  </div>

  <script>
    // se le librerie AR non arrivano (rete lenta / blocchi), lo diciamo invece di restare fermi
    setTimeout(function () {
      if (window.__arBooted) return;
      var t = document.getElementById('loading-text');
      if (t) t.textContent = 'Non riesco a scaricare le librerie AR. Controlla la connessione e ricarica la pagina.';
    }, 20000);
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    window.__arBooted = true;

    /* =========================================================
       CONFIGURAZIONE
       Ordine dei target dentro targets.mind:
         0 = pagina con le due bottiglie
         1 = logo Il Poggiarello
         2 = striscia social (sito + Facebook + Instagram)
       Coordinate: il target è largo 1, centro = (0,0),
       x verso destra, y verso l'alto, z verso chi guarda.
       ========================================================= */
    const LINKS = {
      gutturnio: 'https://www.ilpoggiarellovini.it/vini/gli-spaghi/gutturnio-doc-frizzante/',
      ortrugo:   'https://www.ilpoggiarellovini.it/vini/gli-spaghi/ortrugo-dei-colli-piacentini-doc-frizzante/',
      vini:      'https://www.ilpoggiarellovini.it/vini/',
      facebook:  'https://www.facebook.com/il.poggiarello.vini/',
      instagram: 'https://www.instagram.com/poggiarellovini/'
    };

    const TARGETS = [
      { // 0 - bottiglie (target 886x587 -> altezza 0.6625)
        items: [
          { bottle: { front: 'gutturniofronte.png', back: 'gutturnioretro.png' }, link: LINKS.gutturnio, w: 0.18, x: -0.188, y: -0.12, z: 0, spin: 1, from: { s: 0.05 } },
          { bottle: { front: 'ortrugofronte.png',   back: 'ortrugoretro.png' },   link: LINKS.ortrugo,   w: 0.18, x:  0.194, y: -0.12, z: 0, spin: 1, from: { s: 0.05 } }
        ],
        labels: [
          { text: 'Tocca la bottiglia', x: 0.003, y: -0.22, w: 0.24 }
        ],
        // Logo e social sono stampati sulla STESSA pagina: li agganciamo anche al riconoscimento
        // delle bottiglie (molto più affidabile), nelle loro posizioni misurate sulla pagina.
        pageItems: [
          { img: ['logopoggiarello.png', 'logopozzarello.png'], link: LINKS.vini, w: 0.30, x: -0.207, y: -0.615, z: 0.04, glow: true, from: { y: -0.655, z: 0, s: 0.5 } },
          { img: 'fb.png', link: LINKS.facebook,  w: 0.095, x: 0.215, y: -0.595, z: 0.04, from: { x: 0.256, y: -0.66, z: 0, s: 0.3 } },
          { img: 'ig.png', link: LINKS.instagram, w: 0.095, x: 0.325, y: -0.595, z: 0.04, from: { x: 0.305, y: -0.66, z: 0, s: 0.3 } }
        ]
      },
      { // 1 - logo (target 813x228 -> altezza 0.28)
        items: [
          { img: ['logopoggiarello.png', 'logopozzarello.png'], link: LINKS.vini, w: 0.95, x: 0, y: 0.34, z: 0.08, glow: true, from: { y: 0, z: 0, s: 0.6 } }
        ],
        labels: [
          { text: 'Scopri i nostri vini  ›', x: 0, y: -0.24, w: 0.52 }
        ]
      },
      { // 2 - social (target 826x260 -> altezza 0.315). Le icone escono da quelle stampate
        items: [
          { img: 'fb.png', link: LINKS.facebook,  w: 0.24, x: -0.15, y: 0.33, z: 0.06, from: { x: 0.25, y: 0.0, z: 0, s: 0.35 } },
          { img: 'ig.png', link: LINKS.instagram, w: 0.24, x:  0.15, y: 0.33, z: 0.06, from: { x: 0.41, y: 0.0, z: 0, s: 0.35 } }
        ],
        labels: [
          { text: 'Seguici sui social', x: 0, y: 0.53, w: 0.44 }
        ]
      }
    ];

    /* ---------- elementi UI ---------- */
    const $ = (id) => document.getElementById(id);
    const scannerEl = $('scanner'), loadingEl = $('loading'), messageEl = $('message');

    function showMessage(text, ms = 4000) {
      messageEl.textContent = text; messageEl.style.display = 'block';
      clearTimeout(showMessage._t);
      if (ms) showMessage._t = setTimeout(() => (messageEl.style.display = 'none'), ms);
    }
    function showError(title, text, canRetry = true) {
      $('error-title').textContent = title; $('error-text').innerHTML = text;
      $('retry').style.display = canRetry ? 'inline-block' : 'none';
      $('error').style.display = 'flex'; loadingEl.classList.add('hidden');
    }
    $('retry').addEventListener('click', () => location.reload());

    /* ---------- controlli preliminari (iOS / Android) ---------- */
    const ua = navigator.userAgent || '';
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const inAppBrowser = /FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|TikTok|Snapchat/i.test(ua);

    function preflight() {
      if (!window.isSecureContext) {
        showError('Serve una connessione sicura', 'Apri la pagina con <b>https://</b> (GitHub Pages lo fa già).', false);
        return false;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        const where = isIOS ? 'Safari' : 'Chrome';
        showError('Browser non supportato',
          inAppBrowser
            ? `Stai usando il browser interno di un'app. Tocca <b>⋯</b> e scegli <b>Apri in ${where}</b>.`
            : `Apri questa pagina con <b>${where}</b> aggiornato.`, false);
        return false;
      }
      return true;
    }

    /* ---------- texture helper ---------- */
    const loader = new THREE.TextureLoader();
    // Carica l'immagine e la riduce a max 1024 px: su iPhone le immagini troppo grandi
    // non vengono disegnate in 3D (limite di memoria di WebKit), senza dare errori.
    const MAX_TEX = 1024;
    function loadOne(url) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.decoding = 'async';
        img.onload = () => {
          try {
            const k = Math.min(1, MAX_TEX / Math.max(img.naturalWidth, img.naturalHeight));
            const w = Math.max(1, Math.round(img.naturalWidth * k));
            const h = Math.max(1, Math.round(img.naturalHeight * k));
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            const t = new THREE.CanvasTexture(c);
            t.colorSpace = THREE.SRGBColorSpace;
            t.generateMipmaps = false;
            t.minFilter = THREE.LinearFilter;
            res(t);
          } catch (e) { rej(e); }
        };
        img.onerror = rej;
        img.src = url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now(); // evita versioni vecchie in cache
      });
    }
    // prova il file accanto a index.html, poi dentro la cartella assets/
    async function loadTexture(names) {
      const list = (Array.isArray(names) ? names : [names]).flatMap((n) => [n, 'assets/' + n]);
      for (const url of list) { try { return await loadOne(url); } catch (e) {} }
      throw new Error('non trovato: ' + list[0]);
    }
    function labelTexture(text) {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 160;
      const g = c.getContext('2d');
      const r = 80;
      g.fillStyle = 'rgba(0,0,0,0.62)';
      g.beginPath();
      g.moveTo(r, 0); g.lineTo(c.width - r, 0); g.arc(c.width - r, r, r, -Math.PI / 2, Math.PI / 2);
      g.lineTo(r, c.height); g.arc(r, r, r, Math.PI / 2, Math.PI * 1.5); g.fill();
      g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 5; g.stroke();
      g.fillStyle = '#fff';
      g.font = 'italic 600 64px Georgia, "Times New Roman", serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(text, c.width / 2, c.height / 2 + 4);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return { tex: t, aspect: c.height / c.width };
    }
    function glowTexture() {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(128, 128, 10, 128, 128, 128);
      grd.addColorStop(0, 'rgba(0,0,0,0.75)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(c);
    }

    /* ---------- BOTTIGLIA 3D ROTANTE ----------
       La forma (profilo) viene ricavata dalla sagoma trasparente della foto frontale;
       la superficie è "avvolta" con la foto frontale davanti e quella del retro dietro. */
    function loadImageEl(names) {
      const list = (Array.isArray(names) ? names : [names]).flatMap((n) => [n, 'assets/' + n]);
      return list.reduce((p, url) => p.catch(() => new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img); img.onerror = rej;
        img.src = url + '?v=' + Date.now();
      })), Promise.reject());
    }
    // immagine -> pixel ridotti (max 1024) + per ogni riga: centro e raggio della bottiglia
    function analyzeBottle(img) {
      const k = Math.min(1, 1024 / Math.max(img.naturalWidth, img.naturalHeight));
      const W = Math.max(1, Math.round(img.naturalWidth * k)), H = Math.max(1, Math.round(img.naturalHeight * k));
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, W, H);
      const px = g.getImageData(0, 0, W, H).data;
      // colonna centrale = media delle colonne opache
      let sx = 0, n = 0;
      for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (px[(y * W + x) * 4 + 3] > 128) { sx += x; n++; }
      const mid = n ? Math.round(sx / n) : W >> 1;
      const center = new Float32Array(H), radius = new Float32Array(H);
      let top = -1, bottom = -1;
      for (let y = 0; y < H; y++) {
        const op = (x) => px[(y * W + x) * 4 + 3] > 128;
        // tratto opaco che contiene (o è più vicino a) la colonna centrale: ignora cordini/etichette volanti
        let m = mid;
        if (!op(m)) { let d = 1; while (d < W * 0.15 && !(m + d < W && op(m + d)) && !(m - d >= 0 && op(m - d))) d++;
          m = (m + d < W && op(m + d)) ? m + d : (m - d >= 0 && op(m - d)) ? m - d : -1; }
        if (m < 0) continue;
        let l = m, r = m;
        while (l > 0 && op(l - 1)) l--;
        while (r < W - 1 && op(r + 1)) r++;
        center[y] = (l + r) / 2; radius[y] = (r - l + 1) / 2;
        if (top < 0) top = y; bottom = y;
      }
      // il raggio non può superare quello del corpo e viene lisciato (evita gobbe dovute a cordini)
      const sm = new Float32Array(H);
      for (let y = top; y <= bottom; y++) {
        const win = []; for (let d = -3; d <= 3; d++) { const yy = Math.min(bottom, Math.max(top, y + d)); win.push(radius[yy]); }
        win.sort((a, b) => a - b); sm[y] = win[3];
      }
      // --- etichette: fasce di righe con molti pixel chiari e poco saturi; il resto è vetro ---
      const isLabelPx = (i) => {
        const r = px[i], g = px[i + 1], b = px[i + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        return (r + g + b) / 3 > 150 && (mx - mn) / Math.max(mx, 1) < 0.35;
      };
      const rowFrac = new Float32Array(H);
      for (let y = top; y <= bottom; y++) {
        const l = Math.floor(center[y] - sm[y]), r = Math.ceil(center[y] + sm[y]); let b = 0, t = 0;
        for (let x = Math.max(0, l); x <= Math.min(W - 1, r); x++) { const i = (y * W + x) * 4; if (px[i + 3] > 128) { t++; if (isLabelPx(i)) b++; } }
        rowFrac[y] = t ? b / t : 0;
      }
      const gap = Math.max(3, Math.round(H * 0.02));
      const bands = []; let s0 = -1, last = -100;
      for (let y = top; y <= bottom; y++) {
        if (rowFrac[y] > 0.5) { if (s0 < 0 || y - last > gap) { if (s0 >= 0) bands.push([s0, last]); s0 = y; } last = y; }
      }
      if (s0 >= 0) bands.push([s0, last]);
      const keep = new Uint8Array(W * H);
      // tappo/capsula in cima (sopra la prima etichetta) resta come in foto
      const capEnd = bands.length ? bands[0][0] : top + Math.round((bottom - top) * 0.06);
      for (let y = top; y < capEnd; y++) for (let x = 0; x < W; x++) keep[y * W + x] = 1;
      for (const [a, b] of bands) {
        // colonne dell'etichetta in questa fascia
        // colonne di carta: pixel molto chiari (>200) nella maggior parte delle righe; si tiene il tratto continuo più lungo
        const paper = (i) => { const r = px[i], g = px[i + 1], b2 = px[i + 2], mx = Math.max(r, g, b2), mn = Math.min(r, g, b2);
          return (r + g + b2) / 3 > 200 && (mx - mn) / Math.max(mx, 1) < 0.25; };
        const isCol = new Uint8Array(W);
        for (let x = 0; x < W; x++) { let c = 0; for (let y = a; y <= b; y++) if (paper((y * W + x) * 4)) c++; isCol[x] = c > (b - a + 1) * 0.55 ? 1 : 0; }
        let cl = 0, cr = -1, runS = -1, miss = 0;
        for (let x = 0; x <= W; x++) {
          if (x < W && isCol[x]) { if (runS < 0) runS = x; miss = 0; }
          else if (runS >= 0 && (++miss > 2 || x === W)) { const e = x - miss; if (e - runS > cr - cl) { cl = runS; cr = e; } runS = -1; miss = 0; }
        }
        if (cr < 0) continue;
        for (let y = Math.max(top, a - 1); y <= Math.min(bottom, b + 1); y++) for (let x = Math.max(0, cl - 1); x <= Math.min(W - 1, cr + 1); x++) keep[y * W + x] = 1;
      }
      // colore del vetro = mediana dei pixel scuri fuori dalle etichette
      const rs = [], gs = [], bs = [];
      for (let y = top; y <= bottom; y += 2) for (let x = 0; x < W; x += 2) {
        const i = (y * W + x) * 4; if (px[i + 3] < 200 || keep[y * W + x]) continue;
        if ((px[i] + px[i + 1] + px[i + 2]) / 3 < 110) { rs.push(px[i]); gs.push(px[i + 1]); bs.push(px[i + 2]); }
      }
      const med = (arr) => { if (!arr.length) return 30; arr.sort((p, q) => p - q); return arr[arr.length >> 1]; };
      const glass = [med(rs), med(gs), med(bs)];
      return { W, H, px, center, radius: sm, top, bottom, keep, glass };
    }
    function sample(A, x, y, glass) {
      const xi = Math.min(A.W - 1, Math.max(0, Math.round(x))), yi = Math.min(A.H - 1, Math.max(0, Math.round(y)));
      if (!A.keep[yi * A.W + xi]) return glass;          // vetro: colore uniforme, niente riflessi della foto
      const i = (yi * A.W + xi) * 4; return [A.px[i], A.px[i + 1], A.px[i + 2]];
    }
    async function buildBottle(spec, widthWorld) {
      const frontImg = await loadImageEl(spec.front);
      let backImg = null;
      try { backImg = await loadImageEl(spec.back); } catch (e) { missingFiles.push(spec.back); }
      const F = analyzeBottle(frontImg);
      const B = backImg ? analyzeBottle(backImg) : null;
      const hF = F.bottom - F.top + 1;
      // larghezza massima della sagoma in pixel -> scala verso il mondo AR
      let maxR = 0; for (let y = F.top; y <= F.bottom; y++) maxR = Math.max(maxR, F.radius[y]);
      const scale = widthWorld / (2 * maxR);
      const heightWorld = hF * scale;

      // texture "avvolta" 360°: colonna u = angolo attorno alla bottiglia
      const TW = 1024, TH = Math.min(1024, hF);
      const tc = document.createElement('canvas'); tc.width = TW; tc.height = TH;
      const tg = tc.getContext('2d'); const out = tg.createImageData(TW, TH);
      const EDGE = 0.96; // evita il bordo sfumato della foto
      for (let v = 0; v < TH; v++) {
        const yF = F.top + (v / (TH - 1)) * (hF - 1);
        const yFi = Math.round(yF);
        let yB = 0, hB = 0;
        if (B) { hB = B.bottom - B.top + 1; yB = Math.round(B.top + (v / (TH - 1)) * (hB - 1)); }
        for (let u = 0; u < TW; u++) {
          const phi = (u / TW) * Math.PI * 2, sn = Math.sin(phi), front = Math.cos(phi) >= 0;
          let rgb;
          if (front || !B) {
            // davanti; se manca il retro si riusa il fronte (leggibile anche da dietro)
            rgb = sample(F, F.center[yFi] + (front ? 1 : -1) * F.radius[yFi] * EDGE * sn, yFi, F.glass);
          } else {
            rgb = sample(B, B.center[yB] - B.radius[yB] * EDGE * sn, yB, F.glass);
          }
          const i = (v * TW + u) * 4; out.data[i] = rgb[0]; out.data[i + 1] = rgb[1]; out.data[i + 2] = rgb[2]; out.data[i + 3] = 255;
        }
      }
      tg.putImageData(out, 0, 0);
      const tex = new THREE.CanvasTexture(tc);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter;
      tex.wrapS = THREE.RepeatWrapping;

      // profilo per il tornio (dal basso verso l'alto), coordinate mondo centrate
      const pts = [];
      const N = 96;
      pts.push(new THREE.Vector2(0.0001, -heightWorld / 2));
      for (let j = 0; j <= N; j++) {
        const y = F.bottom - (j / N) * (hF - 1);          // dal fondo alla cima
        const r = F.radius[Math.round(y)] * scale;
        pts.push(new THREE.Vector2(Math.max(0.0005, r), -heightWorld / 2 + (j / N) * heightWorld));
      }
      pts.push(new THREE.Vector2(0.0001, heightWorld / 2));
      const geo = new THREE.LatheGeometry(pts, 72);
      // uv verticale: allinea la texture all'altezza (i punti extra di chiusura stanno agli estremi)
      const uv = geo.attributes.uv, pos = geo.attributes.position;
      for (let i = 0; i < uv.count; i++) uv.setY(i, (pos.getY(i) + heightWorld / 2) / heightWorld);
      uv.needsUpdate = true;
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
        map: tex, side: THREE.DoubleSide, shininess: 90, specular: new THREE.Color(0x555555)
      }));
      addTwine(mesh, F, scale, heightWorld);
      return { mesh, width: widthWorld, height: heightWorld, radius: maxR * scale };
    }

    /* ---------- SPAGO che tiene il tappo (anello sotto il collo + filo sopra il tappo + capi annodati) ---------- */
    const twineMat = new THREE.MeshLambertMaterial({ color: 0xf4f0e6 });
    function addTwine(mesh, F, scale, hW) {
      const hF = F.bottom - F.top + 1;
      const rowToY = (row) => hW / 2 - ((row - F.top) / (hF - 1)) * hW;      // riga foto -> y locale
      const rAt = (row) => F.radius[Math.min(F.bottom, Math.max(F.top, Math.round(row)))] * scale;
      // bocca della bottiglia: raggio massimo nel primo 9% dall'alto; anello subito sotto, dove il collo si stringe
      const zone = Math.round(hF * 0.09);
      let lipRow = F.top, lipR = 0;
      for (let r = F.top; r <= F.top + zone; r++) if (F.radius[r] > lipR) { lipR = F.radius[r]; lipRow = r; }
      let ringRow = lipRow, ringR = 1e9;
      for (let r = lipRow; r <= lipRow + Math.round(hF * 0.05); r++) if (F.radius[r] < ringR) { ringR = F.radius[r]; ringRow = r; }
      const neckR = rAt(ringRow);
      const tube = Math.max(0.0012, neckR * 0.085);
      const ringY = rowToY(ringRow);
      const topY = rowToY(F.top);

      // anello attorno al collo
      const ring = new THREE.Mesh(new THREE.TorusGeometry(neckR + tube * 0.6, tube, 8, 48), twineMat);
      ring.rotation.x = Math.PI / 2; ring.position.y = ringY;
      mesh.add(ring);

      // filo che passa sopra il tappo (segue il profilo della bocca), due fili incrociati
      const steps = 10, side = [];
      for (let i = 0; i <= steps; i++) {
        const row = ringRow - (i / steps) * (ringRow - F.top);
        side.push([rAt(row) + tube * 0.9, rowToY(row)]);
      }
      for (const ang of [0, Math.PI / 2]) {
        const pts = [];
        side.forEach(([x, y]) => pts.push(new THREE.Vector3(x, y, 0)));
        pts.push(new THREE.Vector3(0, topY + tube, 0));
        side.slice().reverse().forEach(([x, y]) => pts.push(new THREE.Vector3(-x, y, 0)));
        const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
        const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 64, tube * 0.85, 6, false), twineMat);
        m.rotation.y = ang;
        mesh.add(m);
      }
      // nodo + due capi che pendono sulla spalla
      const knot = new THREE.Mesh(new THREE.SphereGeometry(tube * 2, 10, 8), twineMat);
      knot.position.set(neckR + tube, ringY, 0);
      mesh.add(knot);
      for (const dz of [-1, 1]) {
        const p0 = new THREE.Vector3(neckR + tube, ringY, 0);
        const len = hW * 0.09;
        const pts = [p0];
        for (let i = 1; i <= 6; i++) {
          const t = i / 6, y = ringY - t * len, row = F.top + ((hW / 2 - y) / hW) * (hF - 1);
          pts.push(new THREE.Vector3(rAt(row) + tube * (1.5 + t * 2), y, dz * tube * (1 + t * 4)));
        }
        const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, tube * 0.75, 6, false), twineMat);
        mesh.add(m);
      }
    }

    /* ---------- AR ---------- */
    let mindarThree = null;
    let started = false;
    const clickables = [];   // mesh cliccabili
    const anchorsState = []; // stato animazioni per target
    let visibleCount = 0;
    const missingFiles = [];

    const easeOutBack = (t) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

    async function buildScene() {
      mindarThree = new MindARThree({
        container: $('ar-container'),
        imageTargetSrc: './targets.mind',
        maxTrack: 2,
        uiLoading: 'no',
        uiScanning: 'no',
        uiError: 'no',
        filterMinCF: 0.0001,
        filterBeta: 0.001,
        warmupTolerance: 1,
        missTolerance: 10
      });
      const { renderer, scene } = mindarThree;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5)); // meno carico sul telefono = aggancio più rapido
      scene.add(new THREE.AmbientLight(0xffffff, 1.1));
      const key = new THREE.DirectionalLight(0xffffff, 1.3); key.position.set(-1, 1.5, 2); scene.add(key);
      const rim = new THREE.DirectionalLight(0xffffff, 0.6); rim.position.set(1.5, 0.5, 1); scene.add(rim);

      for (let i = 0; i < TARGETS.length; i++) {
        const cfg = TARGETS[i];
        const anchor = mindarThree.addAnchor(i);
        const state = { anchor, t: 0, visible: false, objects: [] };

        const content = new THREE.Group();
        anchor.group.add(content);
        state.content = content;
        for (const it of [...cfg.items, ...(cfg.pageItems || [])]) {
          const group = new THREE.Group();
          let h, spinner = null;
          if (it.bottle) {
            let b;
            try { b = await buildBottle(it.bottle, it.w); }
            catch (e) { console.error(e); missingFiles.push(it.bottle.front); continue; }
            h = b.height;
            spinner = b.mesh;
            spinner.position.y = b.height / 2;               // la base appoggia sulla pagina
            const stand = new THREE.Group();
            stand.rotation.x = Math.PI / 2;                  // asse della bottiglia perpendicolare alla pagina
            stand.add(spinner);
            // area di tocco: cilindro invisibile un po' più grande della bottiglia
            const hitCyl = new THREE.Mesh(
              new THREE.CylinderGeometry(b.radius * 1.35, b.radius * 1.35, b.height * 1.05, 16),
              new THREE.MeshBasicMaterial({ visible: false })
            );
            hitCyl.position.y = b.height / 2;
            hitCyl.userData.link = it.link; hitCyl.userData.group = group;
            stand.add(hitCyl);
            clickables.push(hitCyl);
            group.add(stand);
          }
          let tex = null;
          if (!it.bottle) {
            try { tex = await loadTexture(it.img); }
            catch (e) { missingFiles.push([].concat(it.img)[0]); continue; } // immagine mancante: si salta, la pagina parte lo stesso
            h = it.w * (tex.image.height / tex.image.width); // tex.image = canvas ridotto
          }

          if (it.glow) {
            const glow = new THREE.Mesh(
              new THREE.PlaneGeometry(it.w * 1.25, h * 2.2),
              new THREE.MeshBasicMaterial({ map: glowTexture(), transparent: true, depthWrite: false })
            );
            glow.position.z = -0.01;
            group.add(glow);
          }
          if (tex) {
            const mesh = new THREE.Mesh(
              new THREE.PlaneGeometry(it.w, h),
              new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide })
            );
            mesh.userData.link = it.link;
            mesh.userData.group = group;
            group.add(mesh);
          }

          // area di tocco più grande dell'immagine (più facile da colpire col dito)
          if (!it.bottle) {
          const hit = new THREE.Mesh(
            new THREE.PlaneGeometry(it.w * 1.25, h * 1.15),
            new THREE.MeshBasicMaterial({ visible: false })
          );
          hit.userData.link = it.link;
          hit.userData.group = group;
          group.add(hit);
          clickables.push(hit);
          }

          content.add(group);
          state.objects.push({ group, cfg: it, phase: Math.random() * Math.PI * 2, pressed: 0, spinner });
        }

        for (const lb of cfg.labels || []) {
          const { tex, aspect } = labelTexture(lb.text);
          const m = new THREE.Mesh(
            new THREE.PlaneGeometry(lb.w, lb.w * aspect),
            new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
          );
          const group = new THREE.Group();
          group.add(m);
          content.add(group);
          state.objects.push({ group, cfg: { x: lb.x, y: lb.y, z: 0.04, from: { s: 0.001 }, label: true }, phase: 0, pressed: 0 });
        }

        anchor.onTargetFound = () => {
          state.visible = true; state.t = 0;
          visibleCount++;
          scannerEl.classList.add('hidden');
          if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
        };
        anchor.onTargetLost = () => {
          state.visible = false;
          visibleCount = Math.max(0, visibleCount - 1);
          if (visibleCount === 0) scannerEl.classList.remove('hidden');
        };
        anchorsState.push(state);
      }

      // espone lo stato per eventuali test/debug
      window.__poggiarelloAR = { mindarThree, clickables, anchorsState, THREE };
    }

    /* ---------- animazione ---------- */
    const clock = new THREE.Clock();
    function animate() {
      const dt = Math.min(clock.getDelta(), 0.1);
      const time = clock.elapsedTime;
      const pageOn = anchorsState[0] && anchorsState[0].visible;
      anchorsState.forEach((st, i) => { if (i > 0 && st.content) st.content.visible = !pageOn; });
      for (const st of anchorsState) {
        if (st.visible) st.t = Math.min(1, st.t + dt / 0.7);
        const k = easeOutBack(st.t);
        for (const o of st.objects) {
          const c = o.cfg, f = c.from || {};
          const fx = f.x ?? c.x, fy = f.y ?? c.y, fz = f.z ?? c.z, fs = f.s ?? 1;
          const float = c.label ? 0 : Math.sin(time * 1.6 + o.phase) * 0.008;
          o.group.position.set(fx + (c.x - fx) * k, fy + (c.y - fy) * k + float * st.t, fz + (c.z - fz) * k);
          o.pressed = Math.max(0, o.pressed - dt * 4);
          const s = (fs + (1 - fs) * k) * (1 + 0.12 * Math.sin(o.pressed * Math.PI));
          o.group.scale.setScalar(Math.max(0.001, s));
          if (o.spinner) o.spinner.rotation.y = st.visible ? o.spinner.rotation.y + dt * (Math.PI * 2 / 7) * (c.spin || 1) : 0;
        }
      }
      mindarThree.renderer.render(mindarThree.scene, mindarThree.camera);
    }

    /* ---------- tocco / click ---------- */
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();

    // I siti della cantina si aprono DENTRO la pagina, con il bottone rosso per tornare all'AR.
    // Facebook e Instagram non permettono di essere mostrati dentro altre pagine:
    // si aprono nell'app/nuova scheda (su iPhone si torna con "◀" in alto a sinistra).
    const EMBED_HOSTS = ['ilpoggiarellovini.it'];
    const viewer = $('viewer'), frame = $('viewer-frame'), spinner = $('viewer-spinner');
    let viewerOpen = false;
    frame.addEventListener('load', () => { spinner.style.display = 'none'; });

    function openViewer(url) {
      viewerOpen = true;
      spinner.style.display = 'block';
      $('viewer-ext').href = url;
      frame.src = url;
      viewer.classList.add('open');
      viewer.setAttribute('aria-hidden', 'false');
      scannerEl.classList.add('hidden');
      try { history.pushState({ viewer: true }, ''); } catch (e) {}
    }
    function closeViewer(fromHistory) {
      if (!viewerOpen) return;
      viewerOpen = false;
      viewer.classList.remove('open');
      viewer.setAttribute('aria-hidden', 'true');
      frame.src = 'about:blank';
      if (visibleCount === 0) scannerEl.classList.remove('hidden');
      if (!fromHistory) { try { if (history.state && history.state.viewer) history.back(); } catch (e) {} }
      setTimeout(resumeCamera, 200);
    }
    $('back-ar').addEventListener('click', () => closeViewer(false));
    // anche il tasto/gesto "indietro" del telefono riporta all'AR
    window.addEventListener('popstate', () => closeViewer(true));

    function openLink(url) {
      let host = '';
      try { host = new URL(url).hostname; } catch (e) {}
      if (EMBED_HOSTS.some((h) => host === h || host.endsWith('.' + h))) { openViewer(url); return; }
      // apertura immediata nello stesso gesto (necessario per iOS)
      const w = window.open(url, '_blank');
      if (w) { try { w.opener = null; } catch (e) {} }
      else window.location.href = url; // se il popup viene bloccato
    }

    function pick(clientX, clientY) {
      const canvas = mindarThree.renderer.domElement;
      const rect = canvas.getBoundingClientRect();
      ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(ndc, mindarThree.camera);
      const visibles = clickables.filter((m) => {
        let p = m; while (p) { if (!p.visible) return false; p = p.parent; }
        return true;
      });
      const hits = raycaster.intersectObjects(visibles, false);
      return hits.length ? hits[0].object : null;
    }

    function onTap(e) {
      if (!started || viewerOpen) return;
      const hit = pick(e.clientX, e.clientY);
      if (!hit) return;
      e.preventDefault();
      for (const st of anchorsState) for (const o of st.objects) if (o.group === hit.userData.group) o.pressed = 1;
      openLink(hit.userData.link);
    }

    /* ---------- avvio / ripresa ---------- */
    async function start() {
      if (!preflight()) return;
      let step = 'file';
      const setText = (t) => { $('loading-text').textContent = t; };
      setText('Caricamento file…');
      const watchdog = setTimeout(() => {
        if (!started) setText(step === 'fotocamera'
          ? 'La fotocamera non risponde: se vedi una richiesta di accesso, tocca Consenti. Altrimenti chiudi la scheda e riapri il link.'
          : 'Caricamento lento (' + step + ')… controlla la connessione.');
      }, 15000);
      try {
        // 1) il file dei target esiste?
        const r = await fetch('./targets.mind', { cache: 'no-cache' });
        if (!r.ok) throw Object.assign(new Error('targets.mind non trovato (HTTP ' + r.status + ')'), { name: 'FileMancante' });

        // 2) scena 3D e immagini
        step = 'scena';
        setText('Preparazione della scena…');
        await buildScene();

        // 3) fotocamera + riconoscimento
        step = 'fotocamera';
        setText('Avvio della fotocamera…');
        await mindarThree.start();

        started = true;
        clearTimeout(watchdog);
        mindarThree.renderer.setAnimationLoop(animate);
        loadingEl.classList.add('hidden');
        $('ar-container').addEventListener('click', onTap, { passive: false });
        if (missingFiles.length) showMessage('Immagini non trovate: ' + missingFiles.join(', '), 0);
        else if (inAppBrowser) showMessage(`Per un'esperienza migliore apri la pagina in ${isIOS ? 'Safari' : 'Chrome'}.`, 6000);
      } catch (err) {
        clearTimeout(watchdog);
        console.error(err);
        // MindAR non riporta il motivo dell'errore fotocamera: lo chiediamo direttamente al browser
        if (step === 'fotocamera' && !(err && err.name)) {
          try {
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
            s.getTracks().forEach((t) => t.stop());
          } catch (e2) { err = e2; }
        }
        const name = (err && err.name) || '';
        const detail = `<br><small style="opacity:.6">Dettaglio tecnico: ${step} · ${name} ${(err && err.message) || (err ? String(err) : 'sconosciuto')}</small>`;
        const permHelp = isIOS
          ? 'Su iPhone: <b>Impostazioni › Safari › Fotocamera › Consenti</b> (se usi Chrome: <b>Impostazioni › Chrome › Fotocamera</b>), poi ricarica.'
          : 'Tocca l\'icona del lucchetto accanto all\'indirizzo, consenti la <b>Fotocamera</b> e ricarica.';

        if (name === 'FileMancante') {
          showError('File mancante sul sito', 'Il file <b>targets.mind</b> non è nella stessa cartella di <b>index.html</b> su GitHub.' + detail);
        } else if (step === 'scena') {
          showError('Errore di caricamento', 'Non sono riuscito a preparare la scena AR. Controlla la connessione e riprova.' + detail);
        } else if (name === 'NotAllowedError' || name === 'SecurityError') {
          showError('Accesso alla fotocamera negato', permHelp + detail);
        } else if (name === 'NotReadableError' || name === 'AbortError') {
          showError('Fotocamera occupata', 'Un\'altra app o un\'altra scheda sta usando la fotocamera: chiudila e riprova.' + detail);
        } else {
          showError('Impossibile avviare la fotocamera', permHelp + detail);
        }
      }
    }

    // Quando si torna dal sito/app (Facebook, Instagram…) la fotocamera può essere sospesa: la riattiviamo.
    let restarting = false;
    async function resumeCamera() {
      if (!started || restarting) return;
      const video = $('ar-container').querySelector('video');
      const track = video && video.srcObject && video.srcObject.getVideoTracks()[0];
      const dead = !video || !track || track.readyState === 'ended' || track.muted;
      if (!dead) { try { await video.play(); } catch (e) {} if (!video.paused) return; }
      restarting = true;
      try {
        mindarThree.renderer.setAnimationLoop(null);
        mindarThree.stop();
        await mindarThree.start();
        mindarThree.renderer.setAnimationLoop(animate);
        visibleCount = 0;
        anchorsState.forEach((s) => { s.visible = false; s.t = 0; });
        scannerEl.classList.remove('hidden');
      } catch (e) {
        showError('Fotocamera interrotta', 'Ricarica la pagina per riprendere.');
      } finally { restarting = false; }
    }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(resumeCamera, 300); });
    window.addEventListener('pageshow', (e) => { if (e.persisted) setTimeout(resumeCamera, 300); });

    start();
  </script>
</body>
</html>
