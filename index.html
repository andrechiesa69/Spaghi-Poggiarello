<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Il Poggiarello – Realtà Aumentata</title>

  <!-- Supporto import map per iOS < 16.4 e browser più vecchi -->
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; overscroll-behavior: none;
    }
    #ar-container { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }
    /* il video e il canvas creati da MindAR */
    #ar-container video, #ar-container canvas { position: absolute; }

    /* ---------- MIRINO DI SCANSIONE (angoli bianchi) ---------- */
    #scanner {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity .35s ease;
    }
    #scanner.hidden { opacity: 0; }
    .frame {
      position: relative;
      width: min(78vw, 62vh); aspect-ratio: 3 / 2;
    }
    .corner { position: absolute; width: 44px; height: 44px; border: 0 solid #fff; filter: drop-shadow(0 0 4px rgba(0,0,0,.6)); }
    .tl { top: 0; left: 0;  border-top-width: 5px; border-left-width: 5px;  border-top-left-radius: 14px; }
    .tr { top: 0; right: 0; border-top-width: 5px; border-right-width: 5px; border-top-right-radius: 14px; }
    .bl { bottom: 0; left: 0;  border-bottom-width: 5px; border-left-width: 5px;  border-bottom-left-radius: 14px; }
    .br { bottom: 0; right: 0; border-bottom-width: 5px; border-right-width: 5px; border-bottom-right-radius: 14px; }
    .frame { animation: breathe 2.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    .scanline {
      position: absolute; left: 6%; right: 6%; height: 2px; top: 10%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
      animation: scan 2.4s ease-in-out infinite;
    }
    @keyframes scan { 0% { top: 8%; opacity: .2; } 50% { opacity: 1; } 100% { top: 92%; opacity: .2; } }
    .hint {
      margin-top: 22px; padding: 10px 18px; border-radius: 22px;
      background: rgba(0,0,0,.55); font-size: 15px; letter-spacing: .3px; text-align: center;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }

    /* ---------- CARICAMENTO ---------- */
    #loading {
      position: fixed; inset: 0; z-index: 20; background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      transition: opacity .4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading img { width: min(60vw, 280px); }
    .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { margin: 0; font-size: 14px; opacity: .8; }

    /* ---------- MESSAGGI / ERRORI ---------- */
    #message {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      z-index: 30; max-width: 86vw; padding: 12px 18px; border-radius: 14px;
      background: rgba(0,0,0,.8); font-size: 14px; line-height: 1.4; text-align: center; display: none;
    }
    #error {
      position: fixed; inset: 0; z-index: 40; background: #000; display: none;
      flex-direction: column; align-items: center; justify-content: center; padding: 28px; text-align: center; gap: 14px;
    }
    #error h2 { margin: 0; font-weight: 600; font-size: 20px; }
    #error p { margin: 0; opacity: .85; line-height: 1.5; font-size: 15px; }
    #error button, #error a {
      margin-top: 8px; padding: 12px 22px; border-radius: 24px; border: 0;
      background: #fff; color: #000; font-size: 15px; font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="ar-container"></div>

  <div id="scanner">
    <div class="frame">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="scanline"></div>
    </div>
    <div class="hint">Inquadra una pagina del libro</div>
  </div>

  <div id="loading">
    <img src="logopoggiarello.png" alt="Il Poggiarello" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='logopozzarello.png'}else{this.style.display='none'}">
    <div class="spinner"></div>
    <p id="loading-text">Caricamento…</p>
  </div>

  <div id="message"></div>

  <div id="error">
    <h2 id="error-title">Fotocamera non disponibile</h2>
    <p id="error-text"></p>
    <button id="retry" type="button">Riprova</button>
  </div>

  <script>
    // se le librerie AR non arrivano (rete lenta / blocchi), lo diciamo invece di restare fermi
    setTimeout(function () {
      if (window.__arBooted) return;
      var t = document.getElementById('loading-text');
      if (t) t.textContent = 'Non riesco a scaricare le librerie AR. Controlla la connessione e ricarica la pagina.';
    }, 20000);
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    window.__arBooted = true;

    /* =========================================================
       CONFIGURAZIONE
       Ordine dei target dentro targets.mind:
         0 = pagina con le due bottiglie
         1 = logo Il Poggiarello
         2 = striscia social (sito + Facebook + Instagram)
       Coordinate: il target è largo 1, centro = (0,0),
       x verso destra, y verso l'alto, z verso chi guarda.
       ========================================================= */
    const LINKS = {
      gutturnio: 'https://www.ilpoggiarellovini.it/vini/gli-spaghi/gutturnio-doc-frizzante/',
      ortrugo:   'https://www.ilpoggiarellovini.it/vini/gli-spaghi/ortrugo-dei-colli-piacentini-doc-frizzante/',
      vini:      'https://www.ilpoggiarellovini.it/vini/',
      facebook:  'https://www.facebook.com/il.poggiarello.vini/',
      instagram: 'https://www.instagram.com/poggiarellovini/'
    };

    const TARGETS = [
      { // 0 - bottiglie (target 886x587 -> altezza 0.6625)
        items: [
          { img: 'gutturniofronte.png', link: LINKS.gutturnio, w: 0.225, x: -0.188, y: 0.012, z: 0.03, from: { z: 0, s: 0.6 } },
          { img: 'ortrugofronte.png',   link: LINKS.ortrugo,   w: 0.225, x:  0.194, y: 0.012, z: 0.03, from: { z: 0, s: 0.6 } }
        ],
        labels: [
          { text: 'Tocca la bottiglia', x: 0.003, y: -0.22, w: 0.24 }
        ]
      },
      { // 1 - logo (target 813x228 -> altezza 0.28)
        items: [
          { img: ['logopoggiarello.png', 'logopozzarello.png'], link: LINKS.vini, w: 0.95, x: 0, y: 0.34, z: 0.08, glow: true, from: { y: 0, z: 0, s: 0.6 } }
        ],
        labels: [
          { text: 'Scopri i nostri vini  ›', x: 0, y: -0.24, w: 0.52 }
        ]
      },
      { // 2 - social (target 826x260 -> altezza 0.315). Le icone escono da quelle stampate
        items: [
          { img: 'fb.png', link: LINKS.facebook,  w: 0.24, x: -0.15, y: 0.33, z: 0.06, from: { x: 0.25, y: 0.0, z: 0, s: 0.35 } },
          { img: 'ig.png', link: LINKS.instagram, w: 0.24, x:  0.15, y: 0.33, z: 0.06, from: { x: 0.41, y: 0.0, z: 0, s: 0.35 } }
        ],
        labels: [
          { text: 'Seguici sui social', x: 0, y: 0.53, w: 0.44 }
        ]
      }
    ];

    /* ---------- elementi UI ---------- */
    const $ = (id) => document.getElementById(id);
    const scannerEl = $('scanner'), loadingEl = $('loading'), messageEl = $('message');

    function showMessage(text, ms = 4000) {
      messageEl.textContent = text; messageEl.style.display = 'block';
      clearTimeout(showMessage._t);
      if (ms) showMessage._t = setTimeout(() => (messageEl.style.display = 'none'), ms);
    }
    function showError(title, text, canRetry = true) {
      $('error-title').textContent = title; $('error-text').innerHTML = text;
      $('retry').style.display = canRetry ? 'inline-block' : 'none';
      $('error').style.display = 'flex'; loadingEl.classList.add('hidden');
    }
    $('retry').addEventListener('click', () => location.reload());

    /* ---------- controlli preliminari (iOS / Android) ---------- */
    const ua = navigator.userAgent || '';
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const inAppBrowser = /FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|TikTok|Snapchat/i.test(ua);

    function preflight() {
      if (!window.isSecureContext) {
        showError('Serve una connessione sicura', 'Apri la pagina con <b>https://</b> (GitHub Pages lo fa già).', false);
        return false;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        const where = isIOS ? 'Safari' : 'Chrome';
        showError('Browser non supportato',
          inAppBrowser
            ? `Stai usando il browser interno di un'app. Tocca <b>⋯</b> e scegli <b>Apri in ${where}</b>.`
            : `Apri questa pagina con <b>${where}</b> aggiornato.`, false);
        return false;
      }
      return true;
    }

    /* ---------- texture helper ---------- */
    const loader = new THREE.TextureLoader();
    // Carica l'immagine e la riduce a max 1024 px: su iPhone le immagini troppo grandi
    // non vengono disegnate in 3D (limite di memoria di WebKit), senza dare errori.
    const MAX_TEX = 1024;
    function loadOne(url) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.decoding = 'async';
        img.onload = () => {
          try {
            const k = Math.min(1, MAX_TEX / Math.max(img.naturalWidth, img.naturalHeight));
            const w = Math.max(1, Math.round(img.naturalWidth * k));
            const h = Math.max(1, Math.round(img.naturalHeight * k));
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            const t = new THREE.CanvasTexture(c);
            t.colorSpace = THREE.SRGBColorSpace;
            t.generateMipmaps = false;
            t.minFilter = THREE.LinearFilter;
            res(t);
          } catch (e) { rej(e); }
        };
        img.onerror = rej;
        img.src = url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now(); // evita versioni vecchie in cache
      });
    }
    // prova il file accanto a index.html, poi dentro la cartella assets/
    async function loadTexture(names) {
      const list = (Array.isArray(names) ? names : [names]).flatMap((n) => [n, 'assets/' + n]);
      for (const url of list) { try { return await loadOne(url); } catch (e) {} }
      throw new Error('non trovato: ' + list[0]);
    }
    function labelTexture(text) {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 160;
      const g = c.getContext('2d');
      const r = 80;
      g.fillStyle = 'rgba(0,0,0,0.62)';
      g.beginPath();
      g.moveTo(r, 0); g.lineTo(c.width - r, 0); g.arc(c.width - r, r, r, -Math.PI / 2, Math.PI / 2);
      g.lineTo(r, c.height); g.arc(r, r, r, Math.PI / 2, Math.PI * 1.5); g.fill();
      g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 5; g.stroke();
      g.fillStyle = '#fff';
      g.font = 'italic 600 64px Georgia, "Times New Roman", serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(text, c.width / 2, c.height / 2 + 4);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return { tex: t, aspect: c.height / c.width };
    }
    function glowTexture() {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(128, 128, 10, 128, 128, 128);
      grd.addColorStop(0, 'rgba(0,0,0,0.75)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(c);
    }

    /* ---------- AR ---------- */
    let mindarThree = null;
    let started = false;
    const clickables = [];   // mesh cliccabili
    const anchorsState = []; // stato animazioni per target
    let visibleCount = 0;
    const missingFiles = [];

    const easeOutBack = (t) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

    async function buildScene() {
      mindarThree = new MindARThree({
        container: $('ar-container'),
        imageTargetSrc: './targets.mind',
        maxTrack: 3,
        uiLoading: 'no',
        uiScanning: 'no',
        uiError: 'no',
        filterMinCF: 0.0001,
        filterBeta: 0.001,
        warmupTolerance: 3,
        missTolerance: 6
      });
      const { renderer, scene } = mindarThree;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      for (let i = 0; i < TARGETS.length; i++) {
        const cfg = TARGETS[i];
        const anchor = mindarThree.addAnchor(i);
        const state = { anchor, t: 0, visible: false, objects: [] };

        for (const it of cfg.items) {
          let tex;
          try { tex = await loadTexture(it.img); }
          catch (e) { missingFiles.push([].concat(it.img)[0]); continue; } // immagine mancante: si salta, la pagina parte lo stesso
          const h = it.w * (tex.image.height / tex.image.width); // tex.image = canvas ridotto
          const group = new THREE.Group();

          if (it.glow) {
            const glow = new THREE.Mesh(
              new THREE.PlaneGeometry(it.w * 1.25, h * 2.2),
              new THREE.MeshBasicMaterial({ map: glowTexture(), transparent: true, depthWrite: false })
            );
            glow.position.z = -0.01;
            group.add(glow);
          }
          const mesh = new THREE.Mesh(
            new THREE.PlaneGeometry(it.w, h),
            new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide })
          );
          mesh.userData.link = it.link;
          mesh.userData.group = group;
          group.add(mesh);

          // area di tocco più grande dell'immagine (più facile da colpire col dito)
          const hit = new THREE.Mesh(
            new THREE.PlaneGeometry(it.w * 1.25, h * 1.15),
            new THREE.MeshBasicMaterial({ visible: false })
          );
          hit.userData.link = it.link;
          hit.userData.group = group;
          group.add(hit);
          clickables.push(hit);

          anchor.group.add(group);
          state.objects.push({ group, cfg: it, phase: Math.random() * Math.PI * 2, pressed: 0 });
        }

        for (const lb of cfg.labels || []) {
          const { tex, aspect } = labelTexture(lb.text);
          const m = new THREE.Mesh(
            new THREE.PlaneGeometry(lb.w, lb.w * aspect),
            new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
          );
          const group = new THREE.Group();
          group.add(m);
          anchor.group.add(group);
          state.objects.push({ group, cfg: { x: lb.x, y: lb.y, z: 0.04, from: { s: 0.001 }, label: true }, phase: 0, pressed: 0 });
        }

        anchor.onTargetFound = () => {
          state.visible = true; state.t = 0;
          visibleCount++;
          scannerEl.classList.add('hidden');
          if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
        };
        anchor.onTargetLost = () => {
          state.visible = false;
          visibleCount = Math.max(0, visibleCount - 1);
          if (visibleCount === 0) scannerEl.classList.remove('hidden');
        };
        anchorsState.push(state);
      }

      // espone lo stato per eventuali test/debug
      window.__poggiarelloAR = { mindarThree, clickables, anchorsState, THREE };
    }

    /* ---------- animazione ---------- */
    const clock = new THREE.Clock();
    function animate() {
      const dt = Math.min(clock.getDelta(), 0.1);
      const time = clock.elapsedTime;
      for (const st of anchorsState) {
        if (st.visible) st.t = Math.min(1, st.t + dt / 0.7);
        const k = easeOutBack(st.t);
        for (const o of st.objects) {
          const c = o.cfg, f = c.from || {};
          const fx = f.x ?? c.x, fy = f.y ?? c.y, fz = f.z ?? c.z, fs = f.s ?? 1;
          const float = c.label ? 0 : Math.sin(time * 1.6 + o.phase) * 0.008;
          o.group.position.set(fx + (c.x - fx) * k, fy + (c.y - fy) * k + float * st.t, fz + (c.z - fz) * k);
          o.pressed = Math.max(0, o.pressed - dt * 4);
          const s = (fs + (1 - fs) * k) * (1 + 0.12 * Math.sin(o.pressed * Math.PI));
          o.group.scale.setScalar(Math.max(0.001, s));
        }
      }
      mindarThree.renderer.render(mindarThree.scene, mindarThree.camera);
    }

    /* ---------- tocco / click ---------- */
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();

    function openLink(url) {
      // apertura immediata nello stesso gesto (necessario per iOS Safari)
      const w = window.open(url, '_blank');
      if (w) { try { w.opener = null; } catch (e) {} }
      else window.location.href = url; // se il popup viene bloccato
    }

    function pick(clientX, clientY) {
      const canvas = mindarThree.renderer.domElement;
      const rect = canvas.getBoundingClientRect();
      ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(ndc, mindarThree.camera);
      const visibles = clickables.filter((m) => {
        let p = m; while (p) { if (!p.visible) return false; p = p.parent; }
        return true;
      });
      const hits = raycaster.intersectObjects(visibles, false);
      return hits.length ? hits[0].object : null;
    }

    function onTap(e) {
      if (!started) return;
      const hit = pick(e.clientX, e.clientY);
      if (!hit) return;
      e.preventDefault();
      for (const st of anchorsState) for (const o of st.objects) if (o.group === hit.userData.group) o.pressed = 1;
      openLink(hit.userData.link);
    }

    /* ---------- avvio / ripresa ---------- */
    async function start() {
      if (!preflight()) return;
      let step = 'file';
      const setText = (t) => { $('loading-text').textContent = t; };
      setText('Caricamento file…');
      const watchdog = setTimeout(() => {
        if (!started) setText(step === 'fotocamera'
          ? 'La fotocamera non risponde: se vedi una richiesta di accesso, tocca Consenti. Altrimenti chiudi la scheda e riapri il link.'
          : 'Caricamento lento (' + step + ')… controlla la connessione.');
      }, 15000);
      try {
        // 1) il file dei target esiste?
        const r = await fetch('./targets.mind', { cache: 'no-cache' });
        if (!r.ok) throw Object.assign(new Error('targets.mind non trovato (HTTP ' + r.status + ')'), { name: 'FileMancante' });

        // 2) scena 3D e immagini
        step = 'scena';
        setText('Preparazione della scena…');
        await buildScene();

        // 3) fotocamera + riconoscimento
        step = 'fotocamera';
        setText('Avvio della fotocamera…');
        await mindarThree.start();

        started = true;
        clearTimeout(watchdog);
        mindarThree.renderer.setAnimationLoop(animate);
        loadingEl.classList.add('hidden');
        $('ar-container').addEventListener('click', onTap, { passive: false });
        if (missingFiles.length) showMessage('Immagini non trovate: ' + missingFiles.join(', '), 0);
        else if (inAppBrowser) showMessage(`Per un'esperienza migliore apri la pagina in ${isIOS ? 'Safari' : 'Chrome'}.`, 6000);
      } catch (err) {
        clearTimeout(watchdog);
        console.error(err);
        // MindAR non riporta il motivo dell'errore fotocamera: lo chiediamo direttamente al browser
        if (step === 'fotocamera' && !(err && err.name)) {
          try {
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
            s.getTracks().forEach((t) => t.stop());
          } catch (e2) { err = e2; }
        }
        const name = (err && err.name) || '';
        const detail = `<br><small style="opacity:.6">Dettaglio tecnico: ${step} · ${name} ${(err && err.message) || (err ? String(err) : 'sconosciuto')}</small>`;
        const permHelp = isIOS
          ? 'Su iPhone: <b>Impostazioni › Safari › Fotocamera › Consenti</b> (se usi Chrome: <b>Impostazioni › Chrome › Fotocamera</b>), poi ricarica.'
          : 'Tocca l\'icona del lucchetto accanto all\'indirizzo, consenti la <b>Fotocamera</b> e ricarica.';

        if (name === 'FileMancante') {
          showError('File mancante sul sito', 'Il file <b>targets.mind</b> non è nella stessa cartella di <b>index.html</b> su GitHub.' + detail);
        } else if (step === 'scena') {
          showError('Errore di caricamento', 'Non sono riuscito a preparare la scena AR. Controlla la connessione e riprova.' + detail);
        } else if (name === 'NotAllowedError' || name === 'SecurityError') {
          showError('Accesso alla fotocamera negato', permHelp + detail);
        } else if (name === 'NotReadableError' || name === 'AbortError') {
          showError('Fotocamera occupata', 'Un\'altra app o un\'altra scheda sta usando la fotocamera: chiudila e riprova.' + detail);
        } else {
          showError('Impossibile avviare la fotocamera', permHelp + detail);
        }
      }
    }

    // Quando si torna dal sito/app (Facebook, Instagram…) la fotocamera può essere sospesa: la riattiviamo.
    let restarting = false;
    async function resumeCamera() {
      if (!started || restarting) return;
      const video = $('ar-container').querySelector('video');
      const track = video && video.srcObject && video.srcObject.getVideoTracks()[0];
      const dead = !video || !track || track.readyState === 'ended' || track.muted;
      if (!dead) { try { await video.play(); } catch (e) {} if (!video.paused) return; }
      restarting = true;
      try {
        mindarThree.renderer.setAnimationLoop(null);
        mindarThree.stop();
        await mindarThree.start();
        mindarThree.renderer.setAnimationLoop(animate);
        visibleCount = 0;
        anchorsState.forEach((s) => { s.visible = false; s.t = 0; });
        scannerEl.classList.remove('hidden');
      } catch (e) {
        showError('Fotocamera interrotta', 'Ricarica la pagina per riprendere.');
      } finally { restarting = false; }
    }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(resumeCamera, 300); });
    window.addEventListener('pageshow', (e) => { if (e.persisted) setTimeout(resumeCamera, 300); });

    start();
  </script>
</body>
</html>
